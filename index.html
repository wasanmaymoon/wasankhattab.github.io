<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lab 2 - Load GeoJSON & Publish Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body { margin: 0; padding: 0; }
    #map { height: 100vh; width: 100%; }

    .legend {
      background: white;
      padding: 8px 10px;
      border-radius: 6px;
      font: 12px/1.4 Arial, sans-serif;
      box-shadow: 0 0 8px rgba(0,0,0,0.25);
    }
    .legend .item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .legend .box { width: 14px; height: 14px; border: 1px solid #555; }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- jQuery (required for Ajax) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
  // 1) Create map
  var map = L.map('map').setView([31.9038, 35.2046], 12); // Ramallah approx.

  // 2) Base map
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // --- Styles ---
  function zonesStyle(feature) {
    return {
      color: "#444",
      weight: 1,
      fillColor: "#7fcdbb",
      fillOpacity: 0.45
    };
  }

  function containerPointStyle(feature, latlng) {
    return L.circleMarker(latlng, {
      radius: 6,
      color: "#b30000",
      weight: 1,
      fillColor: "#ef3b2c",
      fillOpacity: 0.9
    });
  }

  // --- Layers holders ---
  var zonesLayer, containersLayer;

  // 3) Load Ramallah Zones GeoJSON using jQuery Ajax
  $.getJSON("RamallahZones.json")
    .done(function(data) {
      zonesLayer = L.geoJSON(data, {
        style: zonesStyle,
        onEachFeature: function(feature, layer){
          // popup with any available attribute
          var props = feature.properties || {};
          var name = props.Name || props.NAME || props.Zone || "Ramallah Zone";
          layer.bindPopup("<b>Zone:</b> " + name);
        }
      }).addTo(map);

      // fit map to zones
      map.fitBounds(zonesLayer.getBounds());
    })
    .fail(function() {
      alert("Could not load RamallahZones.json! Make sure the file name is correct and in same folder.");
    });

  // 4) Load Waste Containers GeoJSON using jQuery Ajax
  $.getJSON("wasteContainer.json")
    .done(function(data) {
      containersLayer = L.geoJSON(data, {
        pointToLayer: containerPointStyle,
        onEachFeature: function(feature, layer){
          var props = feature.properties || {};
          var id = props.ID || props.Id || props.id || "Container";
          var type = props.Type || props.TYPE || props.type || "";
          layer.bindPopup("<b>ID:</b> " + id + (type ? "<br><b>Type:</b> " + type : ""));
        }
      }).addTo(map);
    })
    .fail(function() {
      alert("Could not load wasteContainer.json! Make sure the file name is correct and in same folder.");
    });

  // 5) Layer control (checkboxes)
  var overlays = {};
  // we add them after they load, so we update control dynamically
  var control = L.control.layers(null, overlays, { collapsed: false }).addTo(map);

  function addOverlayWhenReady(layerVar, name){
    var check = setInterval(function(){
      if(layerVar){
        control.addOverlay(layerVar, name);
        clearInterval(check);
      }
    }, 200);
  }
  addOverlayWhenReady(zonesLayer, "Ramallah Zones");
  addOverlayWhenReady(containersLayer, "Waste Containers");

  // 6) Simple legend
  var legend = L.control({position: 'bottomright'});
  legend.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <div><b>Legend</b></div>
      <div class="item"><span class="box" style="background:#7fcdbb"></span> Zones</div>
      <div class="item"><span class="box" style="background:#ef3b2c; border-radius:50%"></span> Containers</div>
    `;
    return div;
  };
  legend.addTo(map);

</script>

</body>
</html>
